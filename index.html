<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Zirkel-Timer</title>
<style>
  :root { --bg:#111; --card:#1d1d1d; --fg:#eee; --mut:#9a9a9a; --acc:#e08a00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 14px 48px; }
  h1 { font-size: 22px; margin: 4px 0 10px; }
  h2 { font-size: 18px; margin: 18px 0 6px; }
  h3 { font-size: 16px; margin: 14px 0 4px; color: var(--acc); }
  p, ul, ol { margin: 6px 0; }
  small, .mut { color: var(--mut); }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 0; border-radius: 12px; padding: 13px 14px; background: #2a2a2a; cursor: pointer; }
  button:active { filter: brightness(1.3); }
  button.big { width: 100%; padding: 18px; font-size: 20px; background: var(--acc); color: #111; font-weight: 700; margin-top: 10px; }
  button.ghost { background: transparent; border: 1px solid #444; }
  button.danger { background: #7a2a2a; }
  button.sm { padding: 8px 10px; border-radius: 9px; flex: none; min-width: 38px; }
  select, input, textarea { background: #262626; border: 1px solid #3a3a3a; border-radius: 10px; padding: 10px; width: 100%; }
  label { display: block; margin: 10px 0 4px; color: var(--mut); font-size: 14px; }
  label.chk { display: flex; gap: 10px; align-items: center; color: var(--fg); font-size: 17px; margin: 8px 0; }
  label.chk input { width: 22px; height: 22px; }
  a { color: var(--acc); }
  .back { display: inline-block; margin: 2px 0 8px; color: var(--acc); text-decoration: none; }
  .banner { background: #3b2300; border: 1px solid var(--acc); }
  details summary { cursor: pointer; padding: 6px 0; color: var(--acc); }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid #2a2a2a; }
  .steps li:first-child { border-top: 0; }
  .th { width: 64px; flex: none; background: #f4f4f4; border-radius: 8px; padding: 2px; }
  .th svg, .fig svg { display: block; width: 100%; height: auto; }
  .nm { flex: 1; }
  .nm small { display: block; }
  .fig { background: #f4f4f4; border-radius: 12px; padding: 4px; }
  .fig.pair { display: flex; gap: 4px; background: none; padding: 0; }
  .fig.pair > div { flex: 1; background: #f4f4f4; border-radius: 12px; padding: 4px; }
  .fig.pair small { display: block; text-align: center; color: #555; font-size: 12px; }
  .anim { position: relative; aspect-ratio: 300 / 215; }
  .anim svg { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); }
  .anim svg:nth-child(1) { animation: f1 2.4s infinite; }
  .anim svg:nth-child(2) { animation: f2 2.4s infinite; }
  @keyframes f1 { 0%, 48% { opacity: 1; } 52%, 98% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes f2 { 0%, 48% { opacity: 0; } 52%, 98% { opacity: 1; } 100% { opacity: 0; } }
  .libgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .libgrid a { text-decoration: none; color: var(--fg); background: var(--card); border-radius: 12px; padding: 8px; display: block; }
  .libgrid .t { font-weight: 600; margin-top: 6px; }
  .info h3 { margin-top: 16px; }
  .info li { margin: 3px 0; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 20px; background: #333; color: #ccc; margin-left: 6px; }
  .src { font-size: 13px; color: var(--mut); }

  /* Trainingsansicht */
  .run { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); overflow-y: auto; background: #222; transition: background .3s; }
  .run.work { background: #4a2b00; } .run.rest { background: #0f2a46; } .run.jog { background: #0d3a30; } .run.prep { background: #262626; }
  .run .top { display: flex; justify-content: space-between; color: #ddd; font-size: 15px; }
  .run .bar { height: 5px; background: #ffffff22; border-radius: 3px; margin: 6px 0; overflow: hidden; }
  .run .bar i { display: block; height: 100%; width: 0; background: #fff; }
  .run .phase { text-align: center; letter-spacing: .12em; font-weight: 700; font-size: 17px; margin-top: 4px; }
  .run .time { text-align: center; font-size: min(26vw, 120px); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .run .fig { max-width: 340px; width: 100%; margin: 4px auto; }
  .run .name { text-align: center; font-size: 24px; font-weight: 700; margin-top: 6px; }
  .run .cue { text-align: center; color: #ddd; font-size: 15px; margin: 2px 0 4px; }
  .run .note { text-align: center; min-height: 24px; font-weight: 700; color: #ffd27a; font-size: 20px; }
  .run .next { text-align: center; color: #cfd8e3; font-size: 15px; margin: 2px 0; }
  .run .ctrl { display: flex; gap: 10px; margin: 8px 0 6px; }
  .run .ctrl button { flex: 1; font-size: 26px; padding: 12px; background: #ffffff22; }
  .run .foot { display: flex; gap: 10px; }
  .run .foot button { flex: 1; font-size: 15px; }
  .modal { position: fixed; inset: 0; z-index: 20; background: #000a; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal > div { background: #232323; border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; max-height: 90vh; overflow: auto; }
  .modal .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #333; padding: 10px 16px; border-radius: 20px; z-index: 30; }
</style>
</head>
<body>
<div id="app"></div>
<script src="figures.js"></script>
<script src="exercises.js"></script>
<script src="info.js"></script>
<script src="timeline.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
